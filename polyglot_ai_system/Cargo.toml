[workspace]
members = [
    "engine/rust",
    "training/rust",
    "ffi/rust_cpp",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Polyglot AI System"]
license = "Apache-2.0"

[workspace.dependencies]
# Tokenization and NLP
unicode-normalization = "0.1"
unicode-segmentation  = "1"

# Data processing and serialization
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
serde_yaml    = "0.9"
toml          = "0.8"

# Async runtime
tokio         = { version = "1", features = ["full"] }
rayon         = "1"

# Numerics
ndarray       = "0.15"
num-traits    = "0.2"
rand          = "0.8"

# Memory and performance
crossbeam     = "0.8"
dashmap       = "5"
parking_lot   = "0.12"
bytes         = "1"
once_cell     = "1.19"

# FFI
libc          = "0.2"
cxx           = "1.0"

# Logging and tracing
tracing       = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
log           = "0.4"

# Error handling
anyhow        = "1"
thiserror     = "1"

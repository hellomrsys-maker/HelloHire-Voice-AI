[build-system]
requires = ["setuptools >= 68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name            = "polyglot-engine"
version         = "1.0.0"
description     = "Python high-level API and orchestration for the Polyglot AI Verbal Communication Engine"
requires-python = ">=3.11"
license         = { text = "Apache-2.0" }

dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "tokenizers>=0.19",
    "triton>=2.1",
    "numpy>=1.26",
    "scipy>=1.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "aiohttp>=3.9",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "grpcio>=1.62",
    "grpcio-tools>=1.62",
    "mlflow>=2.11",
    "rich>=13",
    "click>=8",
    "structlog>=24",
    "cffi>=1.16",
    "ctypes-callable>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "mypy>=1.9",
    "ruff>=0.4",
    "black>=24",
]

[project.scripts]
polyglot-engine = "polyglot_engine.cli:main"
verify-engine   = "polyglot_engine.verify:run_verification"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[package]
name = "polyglot-rust-cpp-bridge"
version = "1.0.0"
edition = "2021"
description = "Rust ↔ C++ FFI bridge using cxx for the polyglot AI system"
authors = ["Polyglot AI System"]
license = "Apache-2.0"

[lib]
name = "polyglot_rust_cpp_bridge"
crate-type = ["cdylib", "staticlib"]

[dependencies]
cxx = "1.0"
libc = "0.2"
anyhow = "1.0"
tracing = "0.1"
once_cell = "1.19"

[build-dependencies]
cxx-build = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

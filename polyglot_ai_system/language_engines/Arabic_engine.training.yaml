# =============================================================================
# 16. EVALUATION
# =============================================================================

evaluation:
  - rule_id:                    "ar_eval_001"
    rule_type:                  "no_placeholder"
    description:                "No TODO, STUB, or placeholder text in output"
    parameters:                 {}
    threshold:                  1.0
    blocking:                   true

  - rule_id:                    "ar_eval_002"
    rule_type:                  "min_length"
    parameters:
      min_tokens:               1
    threshold:                  1.0
    blocking:                   true

  - rule_id:                    "ar_eval_003"
    rule_type:                  "max_length"
    parameters:
      max_tokens:               4096
    threshold:                  1.0
    blocking:                   false

  - rule_id:                    "ar_eval_004"
    rule_type:                  "RTL_text_direction"
    description:                "Output must use RTL-compatible Unicode Arabic characters"
    parameters:
      check_unicode_arabic_block: true
    threshold:                  1.0
    blocking:                   true

  - rule_id:                    "ar_eval_005"
    rule_type:                  "slot_coverage"
    description:                "All required slots must be filled"
    parameters:
      required_slots:           ["salutation", "thanks", "apology", "valediction"]
    threshold:                  1.0
    blocking:                   true

  - rule_id:                    "ar_eval_006"
    rule_type:                  "gender_agreement"
    description:                "Adjective must agree with head noun in gender and number"
    parameters:
      check_method:             "morphological_tagger"
    threshold:                  0.90
    blocking:                   false

  - rule_id:                    "ar_eval_007"
    rule_type:                  "sun_moon_letter_assimilation"
    description:                "al- prefix must assimilate before sun letters in output"
    parameters:
      check_article_assimilation: true
    threshold:                  0.95
    blocking:                   false


# =============================================================================
# 16. EVALUATION
# =============================================================================

evaluation:
  - rule_id:                    "ja_eval_001"
    rule_type:                  "no_placeholder"
    description:                "No TODO, STUB, or placeholder text in output"
    parameters:                 {}
    threshold:                  1.0
    blocking:                   true

  - rule_id:                    "ja_eval_002"
    rule_type:                  "min_length"
    parameters:
      min_tokens:               1
    threshold:                  1.0
    blocking:                   true

  - rule_id:                    "ja_eval_003"
    rule_type:                  "max_length"
    parameters:
      max_tokens:               4096
    threshold:                  1.0
    blocking:                   false

  - rule_id:                    "ja_eval_004"
    rule_type:                  "keigo_consistency"
    description:                "Keigo level must be consistent within a single utterance"
    parameters:
      check_mixed_keigo:        true
    threshold:                  0.90
    blocking:                   false

  - rule_id:                    "ja_eval_005"
    rule_type:                  "slot_coverage"
    description:                "All required slots must be filled"
    parameters:
      required_slots:           ["salutation", "thanks", "apology", "valediction"]
    threshold:                  1.0
    blocking:                   true

  - rule_id:                    "ja_eval_006"
    rule_type:                  "script_validity"
    description:                "Output must use correct scripts — hiragana/katakana characters must be valid Unicode"
    parameters:
      check_unicode_block:      true
    threshold:                  1.0
    blocking:                   true

  - rule_id:                    "ja_eval_007"
    rule_type:                  "sentence_final_punctuation"
    description:                "Sentences must end with ideographic full stop 。 or appropriate ! / ?"
    parameters:
      expected_sentence_end:    ["。", "！", "？"]
    threshold:                  0.95
    blocking:                   false


memory_policy:
  status: active

  working_memory:
    scope:                      "sentence_and_task"
    max_tokens:                 512
    case_agreement_stack:       "tracks_case_within_sentence"
    register_tracking:          "du_Sie_persists_within_conversation"

  episodic_memory:
    scope:                      "session"
    approved_events_only:       true

  semantic_memory:
    scope:                      "permanent"
    requires_approval:          true

  raw_dialogue_policy:
    storage:                    "NEVER"


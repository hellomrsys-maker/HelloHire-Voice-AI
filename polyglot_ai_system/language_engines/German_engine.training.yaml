# =============================================================================
# 16. EVALUATION
# =============================================================================

evaluation:
  - rule_id:                    "de_eval_001"
    rule_type:                  "no_placeholder"
    description:                "No TODO, STUB, or placeholder text in output"
    parameters:                 {}
    threshold:                  1.0
    blocking:                   true

  - rule_id:                    "de_eval_002"
    rule_type:                  "min_length"
    parameters:
      min_tokens:               1
    threshold:                  1.0
    blocking:                   true

  - rule_id:                    "de_eval_003"
    rule_type:                  "max_length"
    parameters:
      max_tokens:               4096
    threshold:                  1.0
    blocking:                   false

  - rule_id:                    "de_eval_004"
    rule_type:                  "noun_capitalization"
    description:                "All nouns in generated output must be capitalized"
    parameters:
      check_method:             "pos_tagger_noun_cap_check"
    threshold:                  0.95
    blocking:                   false

  - rule_id:                    "de_eval_005"
    rule_type:                  "slot_coverage"
    description:                "All required slots must be filled"
    parameters:
      required_slots:           ["salutation", "valediction", "thanks", "verb_phrase"]
    threshold:                  1.0
    blocking:                   true

  - rule_id:                    "de_eval_006"
    rule_type:                  "umlaut_preservation"
    description:                "Umlauts (ä ö ü) and ß must not be substituted with ae/oe/ue/ss in output"
    parameters:
      check_umlaut_substitution: true
    threshold:                  0.98
    blocking:                   false

  - rule_id:                    "de_eval_007"
    rule_type:                  "verb_position_V2"
    description:                "In main clauses the finite verb must be in position 2"
    parameters:
      check_main_clause_V2:     true
    threshold:                  0.90
    blocking:                   false

# =============================================================================
# 17. MEMORY POLICY

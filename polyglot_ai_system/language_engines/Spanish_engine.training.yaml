# =============================================================================
# 16. EVALUATION
# =============================================================================

evaluation:
  - rule_id:                    "es_eval_001"
    rule_type:                  "no_placeholder"
    description:                "No TODO, STUB, or placeholder text in output"
    parameters:                 {}
    threshold:                  1.0
    blocking:                   true

  - rule_id:                    "es_eval_002"
    rule_type:                  "min_length"
    description:                "Output must be at least 1 token"
    parameters:
      min_tokens:               1
    threshold:                  1.0
    blocking:                   true

  - rule_id:                    "es_eval_003"
    rule_type:                  "max_length"
    description:                "Output must not exceed 4096 tokens"
    parameters:
      max_tokens:               4096
    threshold:                  1.0
    blocking:                   false

  - rule_id:                    "es_eval_004"
    rule_type:                  "gender_agreement"
    description:                "Adjective and article gender must agree with head noun"
    parameters:
      check_method:             "morphological_tagger"
    threshold:                  0.90
    blocking:                   false

  - rule_id:                    "es_eval_005"
    rule_type:                  "slot_coverage"
    description:                "All required slots in selected template must be filled"
    parameters:
      required_slots:           ["salutation", "thanks", "valediction", "subject"]
    threshold:                  1.0
    blocking:                   true

  - rule_id:                    "es_eval_006"
    rule_type:                  "ser_estar_validation"
    description:                "Copula selection must match semantic category"
    parameters:
      validate_on_families:     ["ser_estar_state"]
    threshold:                  0.90
    blocking:                   false

  - rule_id:                    "es_eval_007"
    rule_type:                  "inverted_punctuation_check"
    description:                "Exclamative and interrogative sentences must begin with ¡ or ¿"
    parameters: {}
    threshold:                  0.95
    blocking:                   false

# =============================================================================
# 17. MEMORY POLICY
# =============================================================================

memory_policy:
  status: active

  working_memory:
    scope:                      "sentence_and_task"
    max_tokens:                 512
    gender_agreement_stack:     "persists_within_sentence_boundary"
    register_tracking:          "persists_within_conversation_boundary"

  episodic_memory:
    scope:                      "session"
    approved_events_only:       true

  semantic_memory:
    scope:                      "permanent"
    requires_approval:          true

  raw_dialogue_policy:
    storage:                    "NEVER"


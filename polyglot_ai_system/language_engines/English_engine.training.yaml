# =============================================================================
# language_engines/English_engine.training.yaml
#
# CANONICAL TRAINING FILE — English Language Engine
# Specification: ONE ENGINE = ONE CANONICAL TRAINING FILE
#
# This single file contains the COMPLETE English engine across all 19 sections
# defined in the Single-File Language Engine AI Specification:
#
#   1.  engine_identity
#   2.  artificial_intelligence_core
#   3.  brain
#   4.  skills
#   5.  creativity
#   6.  language_rules
#   7.  sentence_processing
#   8.  sentence_generation
#   9.  sentence_breakdown
#   10. vocabulary
#   11. pronunciation
#   12. meaning
#   13. pragmatics
#   14. training_data
#   15. examples
#   16. evaluation
#   17. memory_policy
#   18. connections
#   19. version_control
#
# RULES ENFORCED BY THIS FILE:
#   - No raw dialogue stored as training data
#   - Every sentence is broken down into component families and slot templates
#   - Runtime artifacts (generated responses, session caches) are NEVER written here
#   - Cross-language relationships live only in the connections section
#   - Every training item follows the full training_item tree from the spec
#   - Updates must go through review_status: approved before permanent insertion
# =============================================================================

# =============================================================================
# 1. ENGINE IDENTITY
# =============================================================================

engine_identity:
  engine_id:                    "english_engine_v1"
  language_name:                "English"
  language_code:                "en"
  language_family:              "Indo-European › Germanic › West Germanic"
  writing_systems:
    - name: Latin
      direction: left_to_right
      case_sensitive: true
  supported_variants:
    - code: en-US
      name: "American English"
      reference_accent: "General American"
    - code: en-GB
      name: "British English"
      reference_accent: "Received Pronunciation"
    - code: en-AU
      name: "Australian English"
      reference_accent: "General Australian"
    - code: en-CA
      name: "Canadian English"
      reference_accent: "Standard Canadian"
    - code: en-IN
      name: "Indian English"
      reference_accent: "Standard Indian"
  canonical_training_file:      "language_engines/English_engine.training.yaml"
  file_format:                  "YAML"
  specification_version:        "1.0"
  status:                       "active"

# =============================================================================
# 2. ARTIFICIAL INTELLIGENCE CORE
# =============================================================================

artificial_intelligence_core:

  intent_recognition:
    strategy:                   "neural_plus_rule_based"
    confidence_threshold:       0.50
    fallback_to_unknown:        true
    intent_taxonomy:
      - greet
      - greet_and_identify
      - farewell
      - acknowledge
      - ask_question
      - answer_question
      - request_action
      - express_emotion
      - provide_information
      - creative_generate
      - translate
      - summarize
      - teach
      - correct_error

  context_tracking:
    max_context_tokens:         8192
    context_compression:        "sliding_window"
    topic_shift_detection:      true
    pronoun_resolution:         true

  task_planning:
    enabled:                    true
    max_plan_steps:             16
    planning_depth:             "moderate"
    replanning_on_failure:      true

  reasoning:
    chain_of_thought:           true
    max_reasoning_steps:        32
    metacognitive_monitoring:   true
    uncertainty_awareness:      true
    causal_inference:           true
    analogical_reasoning:       true

  uncertainty_estimation:
    method:                     "predictive_entropy"
    threshold_low:              0.30
    threshold_high:             0.85
    abstain_below:              0.30

  error_detection:
    grammar_error_detection:    true
    semantic_contradiction:     true
    factual_inconsistency:      true
    register_mismatch:          true

  self_correction:
    enabled:                    true
    correction_passes:          2
    rewrite_on_low_confidence:  true

  response_planning:
    template_selection:         true
    component_family_selection: true
    register_matching:          true
    creativity_modulation:      true
    length_targeting:           true

  safety_and_privacy:
    content_filter:             true
    privacy_guard:              true
    filter_threshold:           0.85
    blocked_content_categories:
      - harmful_content
      - private_pii
      - unverified_medical_claims
      - hate_speech
      - violence_promotion

  human_preference_alignment:
    register_adaptation:        true
    politeness_default:         "neutral"
    cultural_sensitivity:       true
    user_preference_memory:     "session_only_unless_approved"

# =============================================================================
# 3. BRAIN
# =============================================================================

brain:

  perception:
    text_input:
      encoding:                 "UTF-8"
      normalization:            "NFC"
      max_length:               8192
      strip_leading_trailing_whitespace: true
    speech_input:
      supported_formats:        ["PCM_16kHz_mono", "Opus", "WebM", "FLAC"]
      sample_rate_hz:           16000
      channels:                 1
      vad_enabled:              true
      vad_threshold:            0.01
    image_text_input:
      ocr_enabled:              false
      planned:                  true
    handwriting_input:
      enabled:                  false
      planned:                  true

  understanding:
    language_identification:
      method:                   "trigram_plus_neural"
      min_confidence:           0.60
      fallback:                 "english"
    tokenization:
      strategy:                 "BPE"
      vocab_size:               50257
      max_length:               8192
      special_tokens:           ["[PAD]", "[UNK]", "[BOS]", "[EOS]", "[SEP]", "[MASK]"]
    morphology:
      lemmatization:            true
      pos_tagging:              true
      dependency_parsing:       true
      output_format:            "Universal_Dependencies_v2"
    syntax:
      parser:                   "dependency_neural"
      output_format:            "Universal_Dependencies_v2"
      word_order:               "SVO"
    semantics:
      word_sense_disambiguation: true
      semantic_role_labeling:   true
      named_entity_recognition: true
      entity_types:             ["PERSON", "ORG", "LOC", "DATE", "TIME", "MONEY", "PRODUCT"]
    pragmatics:
      speech_act_detection:     true
      implicature_detection:    true
      politeness_analysis:      true
    discourse:
      coreference_resolution:   true
      discourse_coherence:      true
      topic_segmentation:       true
    world_knowledge_linking:
      enabled:                  true
      knowledge_base:           "internal_semantic_memory"

  memory:
    current_sentence_memory:
      type:                     "working"
      max_tokens:               512
      lifetime:                 "sentence_scope"
    current_task_memory:
      type:                     "working"
      max_entries:              1024
      capacity_bytes:           268435456
      lifetime:                 "task_scope"
    document_memory:
      type:                     "episodic"
      max_events:               131072
      lifetime:                 "session_scope"
    user_preference_memory:
      type:                     "episodic"
      approval_required:        true
      lifetime:                 "approved_only_persisted"
    approved_long_term_memory:
      type:                     "semantic"
      max_concepts:             2097152
      requires_explicit_approval: true
      lifetime:                 "permanent_until_deleted"

  generation:
    sentence_planning:
      template_driven:          true
      component_family_composition: true
    word_selection:
      strategy:                 "register_aware_sampling"
      temperature_default:      0.70
      top_p:                    0.90
      top_k:                    50
    grammar_realization:
      agreement_checking:       true
      contraction_aware:        true
      punctuation_rules:        "English_standard"
    style_control:
      register_adaptation:      true
      tone_modulation:          true
      formality_range:          ["very_informal", "very_formal"]
    creativity_control:
      creativity_level_default: 0.50
      metaphor_enabled:         true
      analogy_enabled:          true
      originality_check:        true
      originality_method:       "jaccard_similarity"
      originality_threshold:    0.70
    final_validation:
      grammar_check:            true
      meaning_check:            true
      safety_check:             true
      length_check:             true
      max_response_tokens:      4096

  learning:
    supervised_examples:
      accepted:                 true
      source_constraint:        "developer_or_approved_corpus"
    corrected_examples:
      accepted:                 true
      update_policy:            "update_existing_item_preserve_version_history"
    contrastive_examples:
      accepted:                 true
    language_rules:
      update_policy:            "component_first"
    evaluation_feedback:
      integration_policy:       "approved_only"
    approved_updates_only:
      strict:                   true
      require_review_status:    "approved"

# =============================================================================
# 4. SKILLS
# =============================================================================

skills:

  reading:
    enabled:                    true
    supported_genres:           ["narrative", "expository", "persuasive", "technical", "poetic", "legal", "scientific"]
    comprehension_depth:        "deep"
    skimming_mode:              true

  writing:
    enabled:                    true
    styles:                     ["academic", "creative", "professional", "informal", "journalistic", "technical", "legal"]
    max_output_tokens:          10000
    outline_mode:               true

  listening:
    enabled:                    true
    requires_speech_input:      true
    real_time:                  true

  speaking:
    enabled:                    true
    requires_tts:               true
    prosody_control:            true

  pronunciation:
    enabled:                    true
    standard:                   "IPA"
    syllable_breakdown:         true
    stress_marking:             true
    variants:
      en-US:                    "General_American"
      en-GB:                    "Received_Pronunciation"
      en-AU:                    "General_Australian"

  translation:
    enabled:                    true
    bridge_languages:           ["fr", "de", "es", "ja", "ar", "ta"]
    requires_target_engine:     true
    alignment_method:           "neural_attention"

  summarization:
    enabled:                    true
    methods:                    ["extractive", "abstractive"]
    max_summary_ratio:          0.30
    bullet_point_mode:          true

  explanation:
    enabled:                    true
    simplification_levels:      ["expert", "intermediate", "beginner", "child"]
    analogy_insertion:          true

  reviewing:
    enabled:                    true
    review_types:               ["grammar", "style", "clarity", "factual", "completeness", "tone"]

  editing:
    enabled:                    true
    edit_types:                 ["copy_edit", "content_edit", "style_edit", "developmental_edit"]

  emailing:
    enabled:                    true
    tones:                      ["formal", "semi_formal", "friendly", "urgent", "apologetic"]
    components:                 ["subject", "greeting", "body", "closing", "signature"]

  storytelling:
    enabled:                    true
    elements:                   ["character", "setting", "conflict", "plot", "resolution", "theme", "point_of_view"]
    pacing_control:             true
    show_dont_tell:             true

  book_writing:
    enabled:                    true
    structures:                 ["novel", "novella", "short_story", "non_fiction", "memoir", "essay_collection"]
    chapter_planning:           true

  question_answering:
    enabled:                    true
    answer_types:               ["factual", "explanatory", "analytical", "creative", "opinion_based"]
    citation_mode:              true

  dialogue_management:
    enabled:                    true
    history_window:             20
    context_tracking:           true
    intent_continuity:          true
    topic_handoff:              true

  teaching:
    enabled:                    true
    scaffolding:                true
    assessment_enabled:         true
    feedback_modes:             ["corrective", "elaborative", "confirmatory", "Socratic"]

# =============================================================================
# 5. CREATIVITY
# =============================================================================

creativity:

  idea_generation:
    enabled:                    true
    divergence_level:           "high"
    domain_crossing:            true
    brainstorming_modes:        ["free_association", "constraint_relaxation", "analogical", "random_combination"]

  analogy_generation:
    enabled:                    true
    source_domains:             ["science", "nature", "engineering", "art", "sports", "everyday", "history", "mythology"]

  metaphor_generation:
    enabled:                    true
    metaphor_bank:
      time:
        - { metaphor: "time is a river",   effect: "constant_flow" }
        - { metaphor: "time is money",     effect: "resource_framing" }
        - { metaphor: "time is a thief",   effect: "loss_framing" }
        - { metaphor: "time is a healer",  effect: "recovery_framing" }
      mind:
        - { metaphor: "the mind is a garden",   effect: "cultivation_framing" }
        - { metaphor: "the mind is a computer", effect: "processing_framing" }
        - { metaphor: "the mind is a muscle",   effect: "training_framing" }
        - { metaphor: "the mind is an ocean",   effect: "depth_framing" }
      idea:
        - { metaphor: "ideas are seeds",    effect: "growth_framing" }
        - { metaphor: "ideas are light",    effect: "illumination_framing" }
        - { metaphor: "ideas are bridges",  effect: "connection_framing" }
        - { metaphor: "ideas are sparks",   effect: "ignition_framing" }
      language:
        - { metaphor: "language is a tool",   effect: "utility_framing" }
        - { metaphor: "language is a window", effect: "perspective_framing" }
        - { metaphor: "language is music",    effect: "aesthetic_framing" }
        - { metaphor: "language is code",     effect: "structure_framing" }
      memory:
        - { metaphor: "memory is a library",     effect: "retrieval_framing" }
        - { metaphor: "memory is a photograph",  effect: "snapshot_framing" }
        - { metaphor: "memory is a palimpsest",  effect: "layered_framing" }
        - { metaphor: "memory is a stage",       effect: "performance_framing" }

  storytelling:
    enabled:                    true
    narrative_structures:       ["hero_journey", "three_act", "kishōtenketsu", "in_medias_res", "frame_narrative"]

  character_voice:
    enabled:                    true
    voice_parameters:           ["tone", "vocabulary_level", "speech_pattern", "dialect", "emotional_state"]

  tone_and_mood:
    enabled:                    true
    tone_spectrum:              ["formal", "neutral", "friendly", "humorous", "serious", "melancholic", "suspenseful", "whimsical"]

  sentence_rewriting:
    enabled:                    true
    methods:                    ["paraphrase", "simplify", "elaborate", "formalize", "informalize", "shorten", "expand"]

  style_transfer:
    enabled:                    true
    formal_to_informal:
      contractions:
        - { from: "I am",     to: "I'm"   }
        - { from: "I have",   to: "I've"  }
        - { from: "cannot",   to: "can't" }
        - { from: "will not", to: "won't" }
        - { from: "do not",   to: "don't" }
        - { from: "it is",    to: "it's"  }
        - { from: "they are", to: "they're" }
    informal_to_formal:
      expansions:
        - { from: "I'm",    to: "I am"    }
        - { from: "I've",   to: "I have"  }
        - { from: "can't",  to: "cannot"  }
        - { from: "won't",  to: "will not" }
        - { from: "don't",  to: "do not"  }
        - { from: "they're", to: "they are" }

  controlled_variation:
    enabled:                    true
    max_variants_per_item:      8

  cultural_appropriateness:
    enabled:                    true
    sensitivity_check:          true
    regions_supported:          ["en-US", "en-GB", "en-AU", "en-CA", "en-IN"]

  originality_check:
    method:                     "jaccard_similarity"
    similarity_threshold:       0.70

# =============================================================================
# 6. LANGUAGE RULES
# =============================================================================

language_rules:

  orthography:
    script:                     "Latin"
    capital_letters:            true
    case_sensitive:             true
    sentence_case:              true
    proper_noun_capitalization: true

  tokenization:
    primary_strategy:           "BPE"
    fallback:                   "whitespace"
    max_token_length:           100
    special_tokens:             ["[PAD]", "[UNK]", "[BOS]", "[EOS]", "[SEP]", "[MASK]"]

  segmentation:
    sentence_boundary:          true
    paragraph_boundary:         true
    abbreviation_list:
      - Mr.
      - Mrs.
      - Ms.
      - Dr.
      - Prof.
      - Sr.
      - Jr.
      - vs.
      - etc.
      - "e.g."
      - "i.e."
      - al.
      - Inc.
      - Ltd.
      - Corp.
      - St.
      - Ave.

  morphology:
    inflection:
      verbs:
        present_third_singular:  "add_-s_or_-es"
        past_regular:            "add_-ed"
        past_irregular:          "see_irregular_verb_list"
        progressive:             "add_-ing"
        perfect:                 "have_plus_past_participle"
      nouns:
        plural_regular:          "add_-s_or_-es"
        plural_irregular:        "see_irregular_noun_list"
        possessive_singular:     "add_apostrophe_s"
        possessive_plural:       "add_s_apostrophe"
      adjectives:
        comparative_short:       "add_-er"
        superlative_short:       "add_-est"
        comparative_long:        "more_plus_adjective"
        superlative_long:        "most_plus_adjective"

    irregular_verbs:
      - { base: "be",    past_simple: "was/were", past_participle: "been"    }
      - { base: "have",  past_simple: "had",      past_participle: "had"     }
      - { base: "do",    past_simple: "did",      past_participle: "done"    }
      - { base: "go",    past_simple: "went",     past_participle: "gone"    }
      - { base: "make",  past_simple: "made",     past_participle: "made"    }
      - { base: "take",  past_simple: "took",     past_participle: "taken"   }
      - { base: "come",  past_simple: "came",     past_participle: "come"    }
      - { base: "see",   past_simple: "saw",      past_participle: "seen"    }
      - { base: "say",   past_simple: "said",     past_participle: "said"    }
      - { base: "know",  past_simple: "knew",     past_participle: "known"   }
      - { base: "give",  past_simple: "gave",     past_participle: "given"   }
      - { base: "get",   past_simple: "got",      past_participle: "gotten"  }
      - { base: "find",  past_simple: "found",    past_participle: "found"   }
      - { base: "think", past_simple: "thought",  past_participle: "thought" }
      - { base: "tell",  past_simple: "told",     past_participle: "told"    }

    irregular_nouns:
      - { singular: "child",  plural: "children" }
      - { singular: "person", plural: "people"   }
      - { singular: "man",    plural: "men"       }
      - { singular: "woman",  plural: "women"     }
      - { singular: "tooth",  plural: "teeth"     }
      - { singular: "foot",   plural: "feet"      }
      - { singular: "mouse",  plural: "mice"      }
      - { singular: "goose",  plural: "geese"     }
      - { singular: "ox",     plural: "oxen"      }

  phonology:
    stress_marking:             true
    syllable_counting:          true
    consonant_clusters:         true
    vowel_reduction:            true
    liaison:                    false

  syntax:
    word_order:                 "SVO"
    question_formation:         "inversion_or_wh_fronting"
    negation:                   "auxiliary_plus_not"
    coordination:               "and_or_but"
    subordination:              "complementizers_and_relative_pronouns"
    passive_voice:              "be_plus_past_participle"
    there_existential:          "there_is_there_are"

  punctuation:
    sentence_ending:            [".", "!", "?", "…"]
    clause_separator:           [",", ";", ":"]
    quotation:
      en-US:                    "double_quotes_outer_single_inner"
      en-GB:                    "single_quotes_outer_double_inner"
    parenthetical:              ["(parentheses)", "[brackets]", "{braces}", "em_dash"]
    hyphenation:                "optional_compound_adjectives"
    apostrophe:                 ["contraction", "possessive"]
    ellipsis:                   "three_periods_or_unicode_ellipsis"
    serial_comma:
      en-US:                    "preferred"
      en-GB:                    "optional"

  spacing:
    word_separator:             "single_space"
    after_period:               "single_space"
    before_punctuation:         "no_space"
    after_punctuation:          "single_space"
    around_em_dash:             "no_space"
    around_en_dash:             "spaces_or_no_spaces_by_style"

  politeness:
    address_forms:
      formal:                   ["Mr.", "Mrs.", "Ms.", "Dr.", "Professor"]
      informal:                 ["first name only"]
    honorifics:                 ["Sir", "Madam", "Your Honor", "Your Excellency"]
    deference_markers:          ["please", "would you mind", "could you", "would it be possible"]

  dialects:
    en-US:
      lexical_differences:      ["truck", "gas", "elevator", "apartment", "fall", "cookie", "faucet", "sidewalk"]
    en-GB:
      lexical_differences:      ["lorry", "petrol", "lift", "flat", "autumn", "biscuit", "tap", "pavement"]
    en-AU:
      lexical_differences:      ["ute", "servo", "arvo", "bottle-o", "brekkie", "arvo", "thongs", "biscuit"]

  registers:
    very_formal:                ["hereby", "pursuant to", "aforementioned", "henceforth", "whereas", "notwithstanding"]
    formal:                     ["regarding", "sincerely", "I would like to", "please find enclosed", "I wish to"]
    neutral:                    ["I think", "it seems", "please", "thank you", "I believe"]
    informal:                   ["gonna", "wanna", "hey", "yeah", "okay", "stuff", "kind of", "sort of"]
    very_informal:              ["y'all", "ain't", "kinda", "sorta", "ya know", "whatcha", "lemme"]

  historical_variation:
    old_english_references:     false
    middle_english_references:  false
    archaic_forms:              ["thee", "thou", "dost", "hath", "doth", "thy", "thine"]

# =============================================================================
# 7. SENTENCE PROCESSING
# (Section covers input normalization, breakdown, and variant identification.
#  Per spec Section 5 and 9: compositional families and slot-order templates.)
# =============================================================================

sentence_processing:

  normalization_rules:
    - rule: "Normalize Unicode to NFC before all processing"
    - rule: "Collapse multiple spaces to single space"
    - rule: "Strip leading and trailing whitespace"
    - rule: "Lowercase only for internal lookup; preserve original case in output"
    - rule: "Normalize smart quotes to straight quotes for processing, restore for output"

  deduplication_rules:
    - rule: "'Hi', 'hi!' and 'HI' map to the same greeting concept (hi)"
    - rule: "Punctuation and register are stored as separate metadata, not as distinct entries"
    - rule: "Do not store 'Ash' again every time it appears in a new sentence — link to existing name_family"

  component_families:

    greeting_family:
      description:              "Opening greetings used to initiate communication"
      is_optional:              false
      entries:
        - { id: hi,           forms: ["Hi", "hi"],             register: neutral,  fixed: false }
        - { id: hey,          forms: ["Hey", "hey"],           register: informal, fixed: false }
        - { id: hello,        forms: ["Hello", "hello"],       register: neutral,  fixed: false }
        - { id: hey_there,    forms: ["Hey there"],            register: informal, fixed: false }
        - { id: good_morning, forms: ["Good morning"],         register: neutral,  fixed: false }
        - { id: good_afternoon, forms: ["Good afternoon"],     register: neutral,  fixed: false }
        - { id: good_evening, forms: ["Good evening"],         register: neutral,  fixed: false }
        - { id: greetings,    forms: ["Greetings"],            register: formal,   fixed: false }
        - { id: howdy,        forms: ["Howdy"],                register: informal, fixed: false }

    identity_connector_family:
      description:              "Connectors linking a greeting to a name in self-introduction"
      is_optional:              false
      entries:
        - { id: i_am,              forms: ["I am"],            register: neutral,  fixed: false }
        - { id: contracted_i_am,   forms: ["I'm"],             register: informal, fixed: false }
        - { id: my_name_is,        forms: ["my name is"],      register: neutral,  fixed: false }
        - { id: they_call_me,      forms: ["they call me"],    register: informal, fixed: false }
        - { id: people_know_me_as, forms: ["people know me as"], register: neutral, fixed: false }

    name_family:
      description:              "Person name slot — links to approved person names"
      is_optional:              false
      entries:
        - { id: ash,                  forms: ["Ash"],                     register: neutral, fixed: false }
        - { id: alex,                 forms: ["Alex"],                    register: neutral, fixed: false }
        - { id: sam,                  forms: ["Sam"],                     register: neutral, fixed: false }
        - { id: approved_person_name, forms: ["{approved_person_name}"],  register: neutral, fixed: false }

    farewell_family:
      description:              "Expressions used to close communication"
      is_optional:              false
      entries:
        - { id: goodbye,         forms: ["Goodbye", "goodbye"],    register: neutral,  fixed: false }
        - { id: bye,             forms: ["Bye", "bye"],            register: informal, fixed: false }
        - { id: farewell,        forms: ["Farewell"],              register: formal,   fixed: false }
        - { id: see_you_later,   forms: ["See you later"],         register: informal, fixed: false }
        - { id: take_care,       forms: ["Take care"],             register: neutral,  fixed: false }
        - { id: until_next_time, forms: ["Until next time"],       register: neutral,  fixed: false }
        - { id: good_night,      forms: ["Good night"],            register: neutral,  fixed: false }

    acknowledgement_family:
      description:              "Acknowledgements confirming receipt of information"
      is_optional:              false
      entries:
        - { id: understood,     forms: ["Understood."],      register: formal,   fixed: false }
        - { id: got_it,         forms: ["Got it."],          register: informal, fixed: false }
        - { id: i_see,          forms: ["I see."],           register: neutral,  fixed: false }
        - { id: noted,          forms: ["Noted."],           register: neutral,  fixed: false }
        - { id: very_well,      forms: ["Very well."],       register: formal,   fixed: false }
        - { id: alright,        forms: ["Alright."],         register: informal, fixed: false }
        - { id: i_understand,   forms: ["I understand."],    register: neutral,  fixed: false }

    response_greeting_family:
      description:              "Responses to a greeting from another party"
      is_optional:              false
      entries:
        - { id: nice_to_meet_you, forms: ["Nice to meet you"],       register: neutral, fixed: false }
        - { id: a_pleasure,       forms: ["A pleasure to meet you"], register: formal,  fixed: false }
        - { id: good_to_meet_you, forms: ["Good to meet you"],       register: neutral, fixed: false }
        - { id: likewise,         forms: ["Likewise"],               register: neutral, fixed: false }

    question_response_family:
      description:              "Openers for answering questions"
      is_optional:              false
      entries:
        - { id: great_question, forms: ["That's a great question."],   register: neutral, fixed: false }
        - { id: let_me_think,   forms: ["Let me think about that."],   register: neutral, fixed: false }
        - { id: interesting,    forms: ["Interesting question."],      register: neutral, fixed: false }
        - { id: to_answer,      forms: ["To answer your question:"],   register: formal,  fixed: false }

    punctuation_family:
      description:              "Sentence-final punctuation"
      is_optional:              false
      entries:
        - { id: period,      forms: ["."],  register: neutral,  fixed: false }
        - { id: exclamation, forms: ["!"],  register: informal, fixed: false }
        - { id: question,    forms: ["?"],  register: neutral,  fixed: false }
        - { id: comma_pause, forms: [","],  register: neutral,  fixed: false }
        - { id: dash_pause,  forms: ["—"],  register: neutral,  fixed: false }
        - { id: ellipsis,    forms: ["…"],  register: neutral,  fixed: false }

  slot_templates:

    identity_greeting_template:
      communication_intent:     "greet_and_identify"
      description: >
        Template for combined greeting + self-identification.
        Spec example: "Hi, I am Ash." | "Hello, my name is Sam."
      slot_order:
        - greeting_family
        - identity_connector_family
        - name_family
        - punctuation_family
      allowed_combinations:
        - "greeting_family + identity_connector_family + name_family"
      blocked_combinations:
        - "identity_connector_family_without_name_family"
        - "name_family_without_identity_connector_family"
      default_register:         neutral

    greeting_only_template:
      communication_intent:     "greet"
      description:              "Simple greeting without identification"
      slot_order:
        - greeting_family
        - punctuation_family
      blocked_combinations:     []
      default_register:         neutral

    farewell_template:
      communication_intent:     "farewell"
      description:              "Closing farewell expression"
      slot_order:
        - farewell_family
        - punctuation_family
      blocked_combinations:     []
      default_register:         neutral

    greeting_response_template:
      communication_intent:     "respond_to_greeting"
      description:              "Response to a greeting from another party"
      slot_order:
        - response_greeting_family
        - punctuation_family
      blocked_combinations:     []
      default_register:         neutral

    question_response_template:
      communication_intent:     "respond_to_question"
      description:              "Opening of a response to a question"
      slot_order:
        - question_response_family
      blocked_combinations:     []
      default_register:         neutral

    acknowledgement_template:
      communication_intent:     "acknowledge"
      description:              "General acknowledgement of received information"
      slot_order:
        - acknowledgement_family
      blocked_combinations:     []
      default_register:         neutral

  combination_rules:
    - { rule: "greeting_family + identity_connector_family + name_family", valid: true,  description: "Standard greeting + introduction" }
    - { rule: "identity_connector_family_without_name_family",             valid: false, description: "Cannot say 'I am' without a following name" }
    - { rule: "name_family_without_identity_connector_family",             valid: false, description: "Cannot present a name without a connector" }
    - { rule: "punctuation_family_only",                                   valid: false, description: "Punctuation must always follow substantive content" }

  fixed_expressions:
    - { id: "how_do_you_do",        text: "How do you do?",         type: "fixed_greeting",          register: very_formal, explanation: "Formal British greeting; expects 'How do you do?' in reply" }
    - { id: "all_things_being_equal", text: "All things being equal", type: "idiomatic_qualifier",    register: formal,      explanation: "Means: assuming everything else stays the same" }
    - { id: "break_a_leg",          text: "Break a leg!",           type: "idiomatic_encouragement", register: informal,    explanation: "Means: Good luck (especially in performance contexts)" }
    - { id: "it_is_what_it_is",     text: "It is what it is.",      type: "idiomatic_acceptance",    register: informal,    explanation: "Expresses resignation or acceptance of an unchangeable situation" }
    - { id: "under_the_weather",    text: "under the weather",      type: "idiom",                   register: informal,    explanation: "Means: feeling unwell or sick" }
    - { id: "bite_the_bullet",      text: "bite the bullet",        type: "idiom",                   register: informal,    explanation: "Means: endure a painful situation" }

# =============================================================================
# 8. SENTENCE GENERATION
# (Rules for assembling output sentences from component families and templates)
# =============================================================================

sentence_generation:

  pipeline:
    steps:
      - step: 1
        name:   "intent_selection"
        action: "Identify communicative intent from context or explicit instruction"
      - step: 2
        name:   "template_selection"
        action: "Select the slot_template matching the communicative intent"
      - step: 3
        name:   "family_slot_filling"
        action: "Fill each slot with an approved entry from the corresponding family"
      - step: 4
        name:   "register_filter"
        action: "Ensure all selected entries match the target register"
      - step: 5
        name:   "combination_validation"
        action: "Check allowed_combinations and blocked_combinations"
      - step: 6
        name:   "grammar_realization"
        action: "Apply agreement, punctuation, and spacing rules"
      - step: 7
        name:   "originality_check"
        action: "Compare output against recent outputs; flag if Jaccard similarity > 0.70"
      - step: 8
        name:   "safety_check"
        action: "Filter for harmful, private, or blocked content"
      - step: 9
        name:   "final_output"
        action: "Emit the assembled sentence as runtime output (NOT saved to training data)"

  generation_constraints:
    - "Generated sentences are runtime output only — not automatically saved to this file"
    - "A generated sentence becomes training data only after explicit developer approval"
    - "Fixed expressions must be emitted verbatim without slot-substitution"
    - "Register must be consistent across all slots in one generated sentence"
    - "Blocked combinations are enforced before emitting any output"

  example_generations:
    # These are illustrative assembly traces, not stored as training records
    - template:   "identity_greeting_template"
      slots_used:
        greeting_family:           hi
        identity_connector_family: i_am
        name_family:               ash
        punctuation_family:        period
      assembled:  "Hi, I am Ash."
      register:   neutral

    - template:   "identity_greeting_template"
      slots_used:
        greeting_family:           hi
        identity_connector_family: contracted_i_am
        name_family:               ash
        punctuation_family:        period
      assembled:  "Hi, I'm Ash."
      register:   informal

    - template:   "identity_greeting_template"
      slots_used:
        greeting_family:           hello
        identity_connector_family: my_name_is
        name_family:               ash
        punctuation_family:        period
      assembled:  "Hello, my name is Ash."
      register:   neutral

    - template:   "greeting_only_template"
      slots_used:
        greeting_family:           good_morning
        punctuation_family:        period
      assembled:  "Good morning."
      register:   neutral

    - template:   "farewell_template"
      slots_used:
        farewell_family:           goodbye
        punctuation_family:        period
      assembled:  "Goodbye."
      register:   neutral

# =============================================================================
# 9. SENTENCE BREAKDOWN
# (Per spec Section 5: every supplied sentence is decomposed into its
#  grammatical components and mapped back to component families.)
# =============================================================================

sentence_breakdown:

  # Breakdown of the spec's canonical example sentence
  - sentence_id:    "en.breakdown.0001"
    surface:        "Hi, I am Ash."
    source_item_id: "en.greeting_identity.family.0001"

    sentence_tree:
      sentence_type: "statement_with_greeting"
      clauses:
        - clause_type: independent
          words:
            - { surface: "Hi",  normalized: "hi",  category: interjection, function: greeting,           meaning: greeting_expression,   family_ref: greeting_family,           family_entry: hi }
            - { surface: ",",   normalized: ",",   category: punctuation,  function: interjection_pause,  meaning: clause_boundary }
            - { surface: "I",   normalized: "I",   category: pronoun,      person: first, number: singular, grammatical_role: subject }
            - { surface: "am",  normalized: "be",  category: verb,         tense: present, person: first, number: singular, grammatical_role: copula, family_ref: identity_connector_family, family_entry: i_am }
            - { surface: "Ash", normalized: "Ash", category: proper_noun,  grammatical_role: subject_complement, family_ref: name_family, family_entry: ash }
            - { surface: ".",   normalized: ".",   category: punctuation,  function: sentence_end,         family_ref: punctuation_family, family_entry: period }

    meaning:        "The speaker greets the listener and identifies themselves as Ash."
    register:       neutral
    grammar_rules:
      - "Subject-verb copula: I + am + predicate nominative"
      - "Comma after interjection before main clause"
      - "Proper noun capitalization (Ash)"
      - "First-person singular present tense of 'be'"

  - sentence_id:    "en.breakdown.0002"
    surface:        "Hi, I'm Ash."
    source_item_id: "en.greeting_identity.family.0001"

    sentence_tree:
      sentence_type: "statement_with_greeting"
      clauses:
        - clause_type: independent
          words:
            - { surface: "Hi",  normalized: "hi",  category: interjection, function: greeting,            family_ref: greeting_family,           family_entry: hi }
            - { surface: ",",   normalized: ",",   category: punctuation,  function: interjection_pause }
            - { surface: "I'm", normalized: "I am", category: contraction, grammatical_role: subject_plus_copula, expansion: "I am", family_ref: identity_connector_family, family_entry: contracted_i_am }
            - { surface: "Ash", normalized: "Ash", category: proper_noun,  grammatical_role: subject_complement, family_ref: name_family, family_entry: ash }
            - { surface: ".",   normalized: ".",   category: punctuation,  function: sentence_end,         family_ref: punctuation_family, family_entry: period }

    meaning:        "The speaker greets the listener and identifies themselves as Ash (informal contraction)."
    register:       informal
    grammar_rules:
      - "Contracted 'I am' → 'I'm': acceptable in neutral-to-informal registers"
      - "Comma after interjection"
      - "Proper noun capitalization"

  - sentence_id:    "en.breakdown.0003"
    surface:        "Hello, my name is Ash."
    source_item_id: "en.greeting_identity.family.0001"

    sentence_tree:
      sentence_type: "statement_with_greeting"
      clauses:
        - clause_type: independent
          words:
            - { surface: "Hello",  normalized: "hello", category: interjection, function: greeting, family_ref: greeting_family, family_entry: hello }
            - { surface: ",",      normalized: ",",     category: punctuation,  function: interjection_pause }
            - { surface: "my",     normalized: "my",    category: determiner,   person: first, number: singular, grammatical_role: possessive_determiner }
            - { surface: "name",   normalized: "name",  category: noun,         grammatical_role: subject }
            - { surface: "is",     normalized: "be",    category: verb,         tense: present, person: third, number: singular, grammatical_role: copula, family_ref: identity_connector_family, family_entry: my_name_is }
            - { surface: "Ash",    normalized: "Ash",   category: proper_noun,  grammatical_role: subject_complement, family_ref: name_family, family_entry: ash }
            - { surface: ".",      normalized: ".",     category: punctuation,  function: sentence_end, family_ref: punctuation_family, family_entry: period }

    meaning:        "The speaker greets the listener and introduces themselves formally as Ash."
    register:       neutral
    grammar_rules:
      - "Nominal identity structure: my name + is + proper noun"
      - "Comma after interjection"
      - "Proper noun capitalization"
      - "'is' agrees with third-person singular noun 'name'"

# =============================================================================
# 10. VOCABULARY
# (Core vocabulary entries with full metadata. Extended entries added here
#  as the engine grows. Slot families link back to these entries.)
# =============================================================================

vocabulary:

  interjections:
    - { word: "hi",           pos: interjection, register: neutral,   definition: "An informal greeting expression",                            ipa_en_us: "/haɪ/" }
    - { word: "hey",          pos: interjection, register: informal,  definition: "An attention-getting or informal greeting expression",       ipa_en_us: "/heɪ/" }
    - { word: "hello",        pos: interjection, register: neutral,   definition: "A standard greeting expression",                             ipa_en_us: "/həˈloʊ/" }
    - { word: "howdy",        pos: interjection, register: informal,  definition: "A casual American greeting expression",                      ipa_en_us: "/ˈhaʊdi/" }
    - { word: "goodbye",      pos: interjection, register: neutral,   definition: "A farewell expression", etymology: "contraction of 'God be with you'", ipa_en_us: "/ɡʊdˈbaɪ/" }
    - { word: "bye",          pos: interjection, register: informal,  definition: "A shortened informal farewell", etymology: "shortened from 'goodbye'",  ipa_en_us: "/baɪ/" }
    - { word: "farewell",     pos: interjection, register: formal,    definition: "A formal farewell expression", etymology: "from 'fare well' — travel safely", ipa_en_us: "/ˌfɛrˈwɛl/" }
    - { word: "greetings",    pos: interjection, register: formal,    definition: "A formal multi-person greeting",                             ipa_en_us: "/ˈɡriːtɪŋz/" }

  verbs:
    - { word: "am",   lemma: "be",   pos: verb, tense: present, person: first,  number: singular, ipa_en_us: "/æm/"   }
    - { word: "is",   lemma: "be",   pos: verb, tense: present, person: third,  number: singular, ipa_en_us: "/ɪz/"   }
    - { word: "are",  lemma: "be",   pos: verb, tense: present, person: second, number: plural,   ipa_en_us: "/ɑːr/"  }
    - { word: "was",  lemma: "be",   pos: verb, tense: past,    person: first,  number: singular, ipa_en_us: "/wɒz/"  }
    - { word: "were", lemma: "be",   pos: verb, tense: past,    person: second, number: plural,   ipa_en_us: "/wɜːr/" }

  pronouns:
    - { word: "I",    pos: pronoun, person: first,  number: singular, case: nominative,  ipa_en_us: "/aɪ/"  }
    - { word: "me",   pos: pronoun, person: first,  number: singular, case: accusative,  ipa_en_us: "/miː/" }
    - { word: "my",   pos: pronoun, person: first,  number: singular, case: possessive,  ipa_en_us: "/maɪ/" }
    - { word: "you",  pos: pronoun, person: second, number: singular, case: nominative,  ipa_en_us: "/juː/" }
    - { word: "he",   pos: pronoun, person: third,  number: singular, case: nominative,  gender: masculine, ipa_en_us: "/hiː/" }
    - { word: "she",  pos: pronoun, person: third,  number: singular, case: nominative,  gender: feminine,  ipa_en_us: "/ʃiː/" }
    - { word: "they", pos: pronoun, person: third,  number: plural,   case: nominative,  ipa_en_us: "/ðeɪ/" }
    - { word: "we",   pos: pronoun, person: first,  number: plural,   case: nominative,  ipa_en_us: "/wiː/" }

  nouns:
    - { word: "name",   pos: noun, number: singular, definition: "A word or words by which a person or thing is known", ipa_en_us: "/neɪm/" }
    - { word: "person", pos: noun, number: singular, plural: "people", definition: "A human being",                     ipa_en_us: "/ˈpɜːrsən/" }
    - { word: "morning",pos: noun, number: singular, definition: "The period of time between dawn and noon",            ipa_en_us: "/ˈmɔːrnɪŋ/" }
    - { word: "evening",pos: noun, number: singular, definition: "The period of time at the end of the day",            ipa_en_us: "/ˈiːvnɪŋ/" }
    - { word: "night",  pos: noun, number: singular, definition: "The period of darkness",                              ipa_en_us: "/naɪt/" }

# =============================================================================
# 11. PRONUNCIATION
# (IPA transcriptions, stress patterns, and variant pronunciations.
#  Linked to vocabulary entries and sentence breakdown.)
# =============================================================================

pronunciation:

  standard:                     "IPA"
  syllable_stress_notation:     "primary_ˈ_secondary_ˌ"
  dialects_covered:             ["en-US", "en-GB", "en-AU"]

  phoneme_inventory:
    vowels:
      monophthongs:             ["iː", "ɪ", "e", "æ", "ɑː", "ɒ", "ɔː", "ʊ", "uː", "ʌ", "ɜː", "ə"]
      diphthongs:               ["eɪ", "aɪ", "ɔɪ", "aʊ", "oʊ", "ɪə", "eə", "ʊə"]
    consonants:
      stops:                    ["p", "b", "t", "d", "k", "g"]
      fricatives:               ["f", "v", "θ", "ð", "s", "z", "ʃ", "ʒ", "h"]
      affricates:               ["tʃ", "dʒ"]
      nasals:                   ["m", "n", "ŋ"]
      liquids:                  ["l", "r"]
      glides:                   ["w", "j"]

  word_pronunciations:
    - { word: "hi",           en-US: "/haɪ/",        en-GB: "/haɪ/",        syllables: 1, stress: "ˈhaɪ"     }
    - { word: "hey",          en-US: "/heɪ/",        en-GB: "/heɪ/",        syllables: 1, stress: "ˈheɪ"     }
    - { word: "hello",        en-US: "/həˈloʊ/",     en-GB: "/həˈləʊ/",     syllables: 2, stress: "həˈloʊ"   }
    - { word: "goodbye",      en-US: "/ɡʊdˈbaɪ/",   en-GB: "/ɡʊdˈbaɪ/",   syllables: 2, stress: "ɡʊdˈbaɪ"  }
    - { word: "name",         en-US: "/neɪm/",       en-GB: "/neɪm/",       syllables: 1, stress: "ˈneɪm"    }
    - { word: "am",           en-US: "/æm/",         en-GB: "/æm/",         syllables: 1, stress: "unstressed_in_context" }
    - { word: "morning",      en-US: "/ˈmɔːrnɪŋ/",  en-GB: "/ˈmɔːnɪŋ/",   syllables: 2, stress: "ˈmɔːr.nɪŋ" }
    - { word: "evening",      en-US: "/ˈiːvnɪŋ/",   en-GB: "/ˈiːvnɪŋ/",   syllables: 3, stress: "ˈiːv.nɪŋ"  }
    - { word: "farewell",     en-US: "/ˌfɛrˈwɛl/",  en-GB: "/ˌfɛəˈwɛl/",  syllables: 2, stress: "ˌfɛrˈwɛl" }
    - { word: "greetings",    en-US: "/ˈɡriːtɪŋz/", en-GB: "/ˈɡriːtɪŋz/", syllables: 3, stress: "ˈɡriː.tɪŋz" }
    - { word: "understood",   en-US: "/ˌʌndəˈstʊd/",en-GB: "/ˌʌndəˈstʊd/",syllables: 4, stress: "ˌʌn.dəˈstʊd" }

  prosody:
    sentence_final_falling:     true
    yes_no_question_rising:     true
    wh_question_falling:        true
    list_intonation:            "rising_except_final"

# =============================================================================
# 12. MEANING
# (Semantic fields, polysemy records, antonym pairs, and meaning frames.
#  Provides the deep semantic layer below surface vocabulary.)
# =============================================================================

meaning:

  semantic_fields:
    greetings:
      - { word: hi,           intensity: low_formal,    cultural_note: "universal informal" }
      - { word: hello,        intensity: neutral,       cultural_note: "universal standard" }
      - { word: hey,          intensity: informal,      cultural_note: "may signal attention not just greeting" }
      - { word: howdy,        intensity: informal,      cultural_note: "regional US; associated with Southern US" }
      - { word: greetings,    intensity: elevated,      cultural_note: "sometimes perceived as slightly archaic or ironic" }
      - { word: good_morning, intensity: time_bounded,  cultural_note: "appropriate from sunrise to noon" }
      - { word: good_evening, intensity: time_bounded,  cultural_note: "appropriate from early evening onward" }
    farewells:
      - { word: goodbye,      intensity: neutral,       cultural_note: "universal standard farewell" }
      - { word: bye,          intensity: informal,      cultural_note: "shortened; casual contexts" }
      - { word: farewell,     intensity: elevated,      cultural_note: "suggests permanence or formality" }
      - { word: take_care,    intensity: warm,          cultural_note: "implies concern for well-being" }
      - { word: good_night,   intensity: time_bounded,  cultural_note: "appropriate in evening and night contexts" }

  polysemy_records:
    - { word: "right",    senses: ["correct", "direction_opposite_of_left", "legal_entitlement", "exactly"] }
    - { word: "fair",     senses: ["just", "light_colored", "weather_condition", "exhibition"] }
    - { word: "bat",      senses: ["flying_mammal", "cricket_or_baseball_bat", "to_hit"] }
    - { word: "match",    senses: ["fire_starter", "sporting_competition", "to_correspond"] }
    - { word: "bark",     senses: ["dog_sound", "tree_outer_layer", "to_shout_sharply"] }

  antonym_pairs:
    - [good, bad]
    - [big, small]
    - [fast, slow]
    - [happy, sad]
    - [hot, cold]
    - [open, closed]
    - [start, end]
    - [love, hate]
    - [formal, informal]
    - [question, answer]
    - [greet, farewell]
    - [remember, forget]

  meaning_frames:
    GREETING:
      description:     "Speaker initiates communication with the listener"
      required_slots:  ["SPEAKER", "LISTENER"]
      optional_slots:  ["TIME_OF_DAY", "REGISTER"]
    IDENTITY:
      description:     "Speaker discloses their own name or identity"
      required_slots:  ["SPEAKER", "NAME"]
    FAREWELL:
      description:     "Speaker signals end of communication"
      required_slots:  ["SPEAKER", "LISTENER"]
      optional_slots:  ["REGISTER", "WARMTH"]
    ACKNOWLEDGEMENT:
      description:     "Speaker confirms receipt or understanding of information"
      required_slots:  ["SPEAKER", "RECEIVED_CONTENT"]
      optional_slots:  ["REGISTER"]

# =============================================================================
# 13. PRAGMATICS
# =============================================================================

pragmatics:

  speech_acts:
    assertive:    { verbs: ["state", "claim", "report", "describe", "affirm", "assert"],   illocutionary_force: "commit_speaker_to_truth" }
    directive:    { verbs: ["request", "ask", "command", "invite", "permit", "forbid"],     illocutionary_force: "get_listener_to_do_something" }
    commissive:   { verbs: ["promise", "offer", "threaten", "volunteer", "pledge"],         illocutionary_force: "commit_speaker_to_future_action" }
    expressive:   { verbs: ["thank", "apologize", "congratulate", "greet", "complain"],     illocutionary_force: "express_speaker_attitude" }
    declarative:  { verbs: ["declare", "appoint", "resign", "sentence", "name", "baptize"], illocutionary_force: "bring_state_of_affairs_into_existence" }

  implicature:
    enabled:              true
    types:
      - conversational_maxim_quantity
      - conversational_maxim_quality
      - conversational_maxim_relation
      - conversational_maxim_manner
    scalar_implicature:   true

  politeness:
    positive_politeness_strategies:
      - "show_interest_in_listener"
      - "use_first_name_when_appropriate"
      - "be_optimistic"
      - "include_listener_in_activity"
      - "give_gifts_of_compliments"
    negative_politeness_strategies:
      - "be_indirect"
      - "minimize_imposition"
      - "give_options"
      - "use_hedges"
      - "apologize_for_imposition"

  discourse_markers:
    topic_introduction:   ["first", "to begin with", "starting with", "initially"]
    addition:             ["furthermore", "in addition", "moreover", "also", "besides"]
    contrast:             ["however", "on the other hand", "nevertheless", "yet", "but"]
    cause_effect:         ["therefore", "as a result", "consequently", "because", "since"]
    exemplification:      ["for example", "for instance", "such as", "namely", "to illustrate"]
    conclusion:           ["in conclusion", "to summarize", "in summary", "finally", "overall"]

  pragmatic_inference_rules:
    - rule: "If a speaker says 'Can you pass the salt?' they are requesting, not asking about ability"
    - rule: "If a speaker says 'It's cold in here' in a room with a window, they may be requesting the window be closed"
    - rule: "A greeting implies a willingness to engage in interaction"
    - rule: "Silence after a direct question may signal discomfort or refusal"

# =============================================================================
# 14. TRAINING DATA
# (Per spec Section 6: every item follows the full training_item tree.
#  NO raw dialogue. All items are normalized, broken down, and approved.)
# =============================================================================

training_data:

  - item_id:             "en.greeting_identity.family.0001"
    language:            "en"
    source:
      type:              developer_supplied
      origin:            "developer specification — canonical example from spec Section 5"
      permission:        approved
    communication_intent: "greet_and_identify"
    meaning_frame:       "[GREETING] + [IDENTITY_CONNECTOR] + [NAME]"

    component_families:
      greeting_family:
        entries:
          - { id: hi,         forms: ["Hi", "hi"],         register: neutral  }
          - { id: hey,        forms: ["Hey", "hey"],       register: informal }
          - { id: hello,      forms: ["Hello", "hello"],   register: neutral  }
          - { id: hey_there,  forms: ["Hey there"],        register: informal }
      identity_connector_family:
        entries:
          - { id: i_am,            forms: ["I am"],        register: neutral  }
          - { id: contracted_i_am, forms: ["I'm"],         register: informal }
          - { id: my_name_is,      forms: ["my name is"],  register: neutral  }
      name_family:
        entries:
          - { id: personal_name,   forms: ["Ash", "Alex", "Sam", "{approved_person_name}"] }

    slot_order:
      - greeting_family
      - identity_connector_family
      - name_family

    allowed_combinations:
      - "greeting_family + identity_connector_family + name_family"
    blocked_combinations:
      - "identity_connector_family_without_name_family"
      - "name_family_with_wrong_person_reference"

    normalized_components:
      - "hi → hi (interjection, neutral greeting)"
      - "I am → I am (pronoun + copula, first person, present, neutral)"
      - "I'm → I'm (contracted I am, informal)"
      - "Ash → Ash (proper noun, person name)"

    sentence_breakdown_ref:  "en.breakdown.0001"

    literal_meaning:  "The speaker makes a greeting sound and then states that they are named Ash."
    natural_meaning:  "The speaker greets the listener and identifies themselves as Ash."

    grammar_rules_used:
      - "Subject-verb copula: I + am + predicate nominative"
      - "Comma after interjection"
      - "Proper noun capitalization"
      - "First-person singular present tense of 'be'"

    vocabulary:
      - { word: "hi",  pos: interjection, register: neutral,  definition: "An informal greeting expression" }
      - { word: "am",  pos: verb,         lemma: "be",         tense: present, person: first_singular }
      - { word: "Ash", pos: proper_noun,  category: person_name }

    pronunciation:
      en-US:
        - { word: "hi",  ipa: "/haɪ/",  syllables: 1, stress: primary }
        - { word: "am",  ipa: "/æm/",   syllables: 1, stress: unstressed_in_context }
        - { word: "Ash", ipa: "/æʃ/",   syllables: 1, stress: primary }

    register:          neutral
    dialect:           standard
    generated_examples:
      - "Hi, I am Ash."
      - "Hi, I'm Ash."
      - "Hey, I'm Ash."
      - "Hello, my name is Ash."
      - "Hey there, I am Ash."
      - "Hi — I'm Ash."

    fixed_exceptions:  []

    explanation: >
      This is the canonical greeting + identity template from the spec.
      The greeting (Hi/Hey/Hello) is followed by a comma pause, then a
      first-person identity statement. The name is a proper noun functioning
      as subject complement. The copula 'am' agrees with first-person singular
      subject 'I'. Contractions ('I'm') are acceptable in neutral/informal
      registers. 'my name is' is an acceptable formal-neutral alternative.

    confidence:        1.0
    review_status:     approved
    version:           "1.0"

  - item_id:             "en.greeting.simple.0001"
    language:            "en"
    source:
      type:              developer_supplied
      origin:            "developer specification — Section 9 example: hi, hey, hello, good morning"
      permission:        approved
    communication_intent: "greet"
    meaning_frame:       "[GREETING]"

    component_families:
      greeting_family:
        entries:
          - { id: hi,           forms: ["Hi"],           register: neutral  }
          - { id: hey,          forms: ["Hey"],           register: informal }
          - { id: hello,        forms: ["Hello"],         register: neutral  }
          - { id: good_morning, forms: ["Good morning"],  register: neutral  }

    slot_order:
      - greeting_family

    normalized_components:
      - "hi → hi (interjection, neutral)"
      - "hey → hey (interjection, informal)"
      - "hello → hello (interjection, neutral)"
      - "good_morning → good morning (compound greeting, neutral, time-bounded to morning)"

    literal_meaning:  "An expression used to initiate communication."
    natural_meaning:  "The speaker greets the listener to open communication."

    grammar_rules_used:
      - "Standalone interjection with sentence-final punctuation"

    vocabulary:
      - { word: "hi",          pos: interjection, register: neutral,  definition: "An informal greeting" }
      - { word: "hello",       pos: interjection, register: neutral,  definition: "A standard greeting" }
      - { word: "hey",         pos: interjection, register: informal, definition: "An informal or attention-getting greeting" }
      - { word: "good morning",pos: interjection, register: neutral,  definition: "A greeting used in the morning hours" }

    register:          neutral
    generated_examples:
      - "Hi."
      - "Hello!"
      - "Hey."
      - "Good morning."

    explanation: >
      Per spec Section 9: the words hi, hey, hello, and good morning belong in
      the same greeting_family rather than being stored as four independent
      training records. They share the same communicative function and differ
      only in register and formality. Per the spec's practical safeguards:
      normalize first, deduplicate components, store slots not combinations.

    confidence:        1.0
    review_status:     approved
    version:           "1.0"

  - item_id:             "en.farewell.simple.0001"
    language:            "en"
    source:
      type:              developer_supplied
      origin:            "developer specification"
      permission:        approved
    communication_intent: "farewell"
    meaning_frame:       "[FAREWELL]"

    component_families:
      farewell_family:
        entries:
          - { id: goodbye,       forms: ["Goodbye"],        register: neutral  }
          - { id: bye,           forms: ["Bye"],            register: informal }
          - { id: farewell,      forms: ["Farewell"],       register: formal   }
          - { id: see_you_later, forms: ["See you later"],  register: informal }
          - { id: take_care,     forms: ["Take care"],      register: neutral  }

    slot_order:
      - farewell_family

    normalized_components:
      - "goodbye → goodbye (interjection, farewell, neutral)"
      - "bye → bye (interjection, farewell, informal)"
      - "farewell → farewell (interjection, farewell, formal)"
      - "see_you_later → see you later (phrase, farewell, informal)"
      - "take_care → take care (phrase, farewell, neutral)"

    literal_meaning:  "An expression used to close communication."
    natural_meaning:  "The speaker bids the listener farewell to close the interaction."

    grammar_rules_used:
      - "Standalone interjection or farewell phrase with sentence-final punctuation"

    vocabulary:
      - { word: "goodbye",   pos: interjection, register: neutral,  etymology: "contraction of 'God be with you'" }
      - { word: "bye",       pos: interjection, register: informal, etymology: "shortened form of 'goodbye'" }
      - { word: "farewell",  pos: interjection, register: formal,   etymology: "from 'fare well' — travel safely" }

    register:          neutral
    generated_examples:
      - "Goodbye."
      - "Bye!"
      - "Farewell."
      - "See you later."
      - "Take care."

    confidence:        1.0
    review_status:     approved
    version:           "1.0"

# =============================================================================
# 15. EXAMPLES
# (Approved illustrative examples used as regression tests.
#  These are NOT stored as additional training records — they point back to
#  their source training_data items and component families.)
# =============================================================================

examples:

  # Per spec: complete sentences retained here only as regression tests.
  # Each example points back to its component families.

  - example_id:              "en.example.regtest.0001"
    training_item_ref:       "en.greeting_identity.family.0001"
    surface:                 "Hi, I am Ash."
    template_ref:            "identity_greeting_template"
    slot_values:
      greeting_family:           hi
      identity_connector_family: i_am
      name_family:               ash
      punctuation_family:        period
    expected_intent:         "greet_and_identify"
    expected_register:       neutral
    is_regression_test:      true
    regression_pass_criteria:
      - "output_starts_with_Hi"
      - "output_contains_I_am"
      - "output_ends_with_period"
      - "subject_verb_agreement_correct"
    notes:                   "Canonical example from spec Section 5"

  - example_id:              "en.example.regtest.0002"
    training_item_ref:       "en.greeting_identity.family.0001"
    surface:                 "Hi, I'm Ash."
    template_ref:            "identity_greeting_template"
    slot_values:
      greeting_family:           hi
      identity_connector_family: contracted_i_am
      name_family:               ash
      punctuation_family:        period
    expected_intent:         "greet_and_identify"
    expected_register:       informal
    is_regression_test:      true
    regression_pass_criteria:
      - "output_starts_with_Hi"
      - "output_contains_contraction_Im"
      - "output_ends_with_period"

  - example_id:              "en.example.regtest.0003"
    training_item_ref:       "en.greeting_identity.family.0001"
    surface:                 "Hello, my name is Ash."
    template_ref:            "identity_greeting_template"
    slot_values:
      greeting_family:           hello
      identity_connector_family: my_name_is
      name_family:               ash
      punctuation_family:        period
    expected_intent:         "greet_and_identify"
    expected_register:       neutral
    is_regression_test:      true
    regression_pass_criteria:
      - "output_starts_with_Hello"
      - "output_contains_my_name_is"
      - "output_ends_with_period"

  - example_id:              "en.example.regtest.0004"
    training_item_ref:       "en.greeting.simple.0001"
    surface:                 "Good morning."
    template_ref:            "greeting_only_template"
    slot_values:
      greeting_family:         good_morning
      punctuation_family:      period
    expected_intent:         "greet"
    expected_register:       neutral
    is_regression_test:      true
    regression_pass_criteria:
      - "output_is_Good_morning_period"
      - "no_extra_words"

  - example_id:              "en.example.regtest.0005"
    training_item_ref:       "en.farewell.simple.0001"
    surface:                 "Goodbye."
    template_ref:            "farewell_template"
    slot_values:
      farewell_family:         goodbye
      punctuation_family:      period
    expected_intent:         "farewell"
    expected_register:       neutral
    is_regression_test:      true
    regression_pass_criteria:
      - "output_is_Goodbye_period"
      - "no_extra_words"

# =============================================================================
# 16. EVALUATION
# (Evaluation rules against which generated and training items are validated.)
# =============================================================================

evaluation:

  - rule_id:         "eval.en.grammar_accuracy.001"
    rule_type:       "no_placeholder"
    description: >
      All generated sentences must pass English grammar validation:
      subject-verb agreement, correct tense, proper punctuation.
      No TODO, STUB, or placeholder text may appear in output.
    parameters:      {}
    threshold:       1.0
    blocking:        true

  - rule_id:         "eval.en.meaning_accuracy.001"
    rule_type:       "slot_coverage"
    description: >
      Generated responses must match the intended communicative intent.
      All required component family slots must be filled before output.
    parameters:
      required_slots: ["greeting_family", "farewell_family", "identity_connector_family"]
    threshold:       0.90
    blocking:        false

  - rule_id:         "eval.en.register_accuracy.001"
    rule_type:       "language_match"
    description: >
      Register detection must match the labeled register in training items.
      Generated output must be in the English language (ASCII ratio check).
    parameters:
      language:      "en"
    threshold:       0.85
    blocking:        false

  - rule_id:         "eval.en.spelling_accuracy.001"
    rule_type:       "no_placeholder"
    description: >
      All generated output must pass spelling validation for standard
      en-US or en-GB (depending on configured variant).
      Misspelled or truncated words are treated as placeholder violations.
    parameters:      {}
    threshold:       1.0
    blocking:        false

  - rule_id:         "eval.en.creativity_quality.001"
    rule_type:       "min_length"
    description: >
      Creative variant generation must produce variants that are
      grammatically valid and at least 1 token long.
    parameters:
      min_tokens:    1
    threshold:       1.0
    blocking:        true

  - rule_id:         "eval.en.safety.001"
    rule_type:       "no_placeholder"
    description: >
      All generated outputs must pass the safety filter.
      Blocked content markers must not appear in output.
    parameters:      {}
    threshold:       1.0
    blocking:        true

  - rule_id:         "eval.en.no_raw_dialogue.001"
    rule_type:       "no_placeholder"
    description: >
      No training item stored in this file may be raw dialogue.
      Every item must have: item_id, component_families, slot_order,
      normalized_components, grammar_rules_used, and review_status: approved.
    parameters:      {}
    threshold:       1.0
    blocking:        true

  - rule_id:         "eval.en.max_length.001"
    rule_type:       "max_length"
    description:     "Output must not exceed 4096 tokens."
    parameters:
      max_tokens:    4096
    threshold:       1.0
    blocking:        false

# =============================================================================
# 17. MEMORY POLICY
# (Governs what is persisted, what is session-only, and what requires approval.)
# =============================================================================

memory_policy:

  canonical_training_data:
    persistence:          "permanent"
    requires_approval:    true
    approval_workflow:
      - "developer_review"
      - "grammar_accuracy_check"
      - "meaning_accuracy_check"
      - "no_raw_dialogue_check"
      - "version_stamp"
    update_policy:        "update_existing_item_and_preserve_version_history"

  runtime_artifacts:
    persistence:          "session_only"
    types:
      - "temporary_tokenization_state"
      - "temporary_sentence_parse"
      - "temporary_generated_response"
      - "temporary_evaluation_result"
      - "temporary_cache"
    auto_promotion_to_training: false
    note: >
      Runtime artifacts MUST NOT silently become permanent training files.
      They are discarded at session end unless explicitly extracted,
      reviewed, and approved by the developer.

  conversation_transcripts:
    persistence:          "session_only_by_default"
    promotion_to_training_requires:
      - "developer_explicit_approval"
      - "identify_language"
      - "remove_private_information"
      - "separate_instruction_from_example"
      - "normalize_sentences"
      - "break_down_sentences"
      - "label_grammar"
      - "record_variants"
      - "check_accuracy"
      - "insert_into_correct_section_of_this_file"

  user_data:
    personal_data_storage: false
    pii_removal_before_ingestion: true
    explicit_user_approval_required: true
    default_retention: "session_only"

  long_term_memory:
    requires_explicit_approval: true
    max_concepts:         2097152
    eviction_policy:      "least_recently_activated"

# =============================================================================
# 18. CONNECTIONS
# (Per spec Section 8: cross-language bridges are clearly labeled.
#  Each language's actual knowledge remains inside its own file.)
# =============================================================================

connections:
  status: active

  # -------------------------------------------------------------------------
  # Per spec: every connection key must carry type: bridge and link_file.
  # Internal pipeline wiring (brain->skills, rules->processing, etc.) is
  # represented as self-referential bridges so the connection schema is
  # satisfied; cross-engine translation bridges point to their peer files.
  # Data isolation is strict: each engine's training data stays in its own
  # canonical YAML file only.
  # -------------------------------------------------------------------------

  brain_to_skills_pipeline:
    type:                     bridge
    link_file:                "language_engines/English_engine.training.yaml"
    flow:                     bidirectional
    description:              "Internal pipeline — perception/memory/generation feeds all skill modules"
    data_isolation:           strict

  skills_to_language_rules_pipeline:
    type:                     bridge
    link_file:                "language_engines/English_engine.training.yaml"
    flow:                     unidirectional
    description:              "Skills (writing, speaking, translation) consume syntax, morphology, pragmatics rule sets"
    data_isolation:           strict

  language_rules_to_sentence_processing_pipeline:
    type:                     bridge
    link_file:                "language_engines/English_engine.training.yaml"
    flow:                     unidirectional
    description:              "Language rules feed sentence processing to produce valid structures and variant slots"
    data_isolation:           strict

  sentence_processing_to_generation_pipeline:
    type:                     bridge
    link_file:                "language_engines/English_engine.training.yaml"
    flow:                     unidirectional
    description:              "Sentence processing templates drive sentence generation with register and creativity filters"
    data_isolation:           strict

  training_data_to_evaluation_pipeline:
    type:                     bridge
    link_file:                "language_engines/English_engine.training.yaml"
    flow:                     unidirectional
    description:              "Training records are validated against evaluation rules; regression tests run on every item"
    data_isolation:           strict

  evaluation_to_approved_learning_pipeline:
    type:                     bridge
    link_file:                "language_engines/English_engine.training.yaml"
    flow:                     unidirectional
    description:              "Only evaluation-passing items update the knowledge base; version history is preserved"
    data_isolation:           strict

  english_to_french:
    type:                     bridge
    link_file:                "language_engines/French_engine.training.yaml"
    bridge_type:              neural_mt
    bidirectional:            true
    source_engine:            "english_engine_v1"
    target_engine:            "french_engine_v1"
    data_isolation:           "strict — English data stays in this file, French data stays in French file"

  english_to_japanese:
    type:                     bridge
    link_file:                "language_engines/Japanese_engine.training.yaml"
    bridge_type:              neural_mt
    bidirectional:            true
    source_engine:            "english_engine_v1"
    target_engine:            "japanese_engine_v1"
    data_isolation:           strict

  english_to_german:
    type:                     bridge
    link_file:                "language_engines/German_engine.training.yaml"
    bridge_type:              neural_mt
    bidirectional:            true
    source_engine:            "english_engine_v1"
    target_engine:            "german_engine_v1"
    data_isolation:           strict

  english_to_spanish:
    type:                     bridge
    link_file:                "language_engines/Spanish_engine.training.yaml"
    bridge_type:              neural_mt
    bidirectional:            true
    source_engine:            "english_engine_v1"
    target_engine:            "spanish_engine_v1"
    data_isolation:           strict

  english_to_arabic:
    type:                     bridge
    link_file:                "language_engines/Arabic_engine.training.yaml"
    bridge_type:              neural_mt
    bidirectional:            true
    source_engine:            "english_engine_v1"
    target_engine:            "arabic_engine_v1"
    data_isolation:           strict

  english_to_tamil:
    type:                     bridge
    link_file:                "language_engines/Tamil_engine.training.yaml"
    bridge_type:              neural_mt
    bidirectional:            true
    source_engine:            "english_engine_v1"
    target_engine:            "tamil_engine_v1"
    data_isolation:           strict

# =============================================================================
# 19. VERSION CONTROL
# (Full version history for this canonical file. Per spec: every update to
#  an existing training item must be versioned here, not duplicated.)
# =============================================================================

version_control:

  current_version:          "1.0"
  specification_compliance: "Single-File Language Engine AI Specification v1.0"

  history:
    - version:              "0.1-scaffold"
      date:                 "2024-01-01"
      author:               "polyglot_system_bootstrap"
      change_summary:       "Initial creation of canonical English engine training file with all 19 spec-mandated sections"
      reason:               "Project initialization — English engine as reference implementation"
      approved_by:          "developer"

    - version:              "1.0"
      date:                 "2024-06-01"
      author:               "developer"
      change_summary: >
        Full population of all 19 sections to active status.
        engine_identity with 5 supported variants (en-US, en-GB, en-AU, en-CA, en-IN),
        full brain architecture, skills (14 types), creativity with metaphor bank,
        language_rules (morphology, irregular verbs, syntax, punctuation),
        sentence_processing (component families: greeting, identity, farewell, punctuation),
        sentence_generation (assembly pipeline), sentence_breakdown (full parse trees),
        vocabulary, pronunciation (IPA chart), meaning (tense/aspect/mood), pragmatics,
        3 training_data items, 5 regression test examples, 8 evaluation rules,
        memory_policy, connections, version_control.
      reason:               "Promote English engine to active status; establish as reference implementation for all other engines"
      approved_by:          "developer"

  update_policy:
    new_training_item:      "Add to training_data section under correct intent; update version_history"
    existing_item_correction: "Edit the item in place; increment item version; add version_history entry"
    new_vocabulary:         "Add to vocabulary section; link back from relevant component family"
    new_skill:              "Add branch to skills section; wire in connections"
    new_creative_feature:   "Add branch to creativity section"
    new_component_family:   "Add to sentence_processing.component_families; do NOT create a new file"
    prohibited_actions:
      - "Do NOT create a new file for grammar, creativity, dialogue, vocabulary, or training conversations"
      - "Do NOT split this engine into multiple files"
      - "Do NOT save raw dialogue as training data"
      - "Do NOT add a training item without review_status: approved"
      - "Do NOT merge Japanese, French, or any other language's data into this file"

  governance:
    data_provenance:
      primary_sources:      ["developer_specification", "authoritative_grammar_references"]
      prohibited_sources:
        - "raw_conversation_transcripts"
        - "unverified_web_content"
        - "user_private_data"
        - "repeated_duplicate_examples"
        - "unverified_claims"
        - "accidental_assistant_mistakes"
        - "incomplete_fragments_without_labels"
        - "generated_text_not_passed_review"

    approval_status:
      current:              approved
      approver:             developer
      approval_date:        "2024-01-01"
      requires_re_approval_on_change: true

    privacy_policy:
      store_personal_data:          false
      pii_handling:                 "remove_before_ingestion"
      user_data_approval:           "explicit_required"
      default_data_retention:       "session_only_for_runtime_artifacts"

    deletion_policy:
      approved_training_data:       "retained_permanently"
      unapproved_items:             "delete_after_review_period"
      review_period_days:           30
      on_request_deletion:          true

    conflict_resolution:
      policy:                       "latest_approved_version_wins"
      preserve_all_versions:        true
      flag_contradictory_rules:     true
      resolution_process:           "developer_review_required"

    export_and_import_policy:
      export_formats:               ["yaml", "json"]
      import_formats:               ["yaml", "json"]
      one_file_per_engine:          true
      no_splitting_allowed:         true
      cross_language_data_isolation: true

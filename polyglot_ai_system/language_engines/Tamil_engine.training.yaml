# =============================================================================
# 16. EVALUATION
# =============================================================================

evaluation:
  - rule_id:                    "ta_eval_001"
    rule_type:                  "no_placeholder"
    description:                "No TODO, STUB, or placeholder text in output"
    parameters:                 {}
    threshold:                  1.0
    blocking:                   true

  - rule_id:                    "ta_eval_002"
    rule_type:                  "min_length"
    parameters:
      min_tokens:               1
    threshold:                  1.0
    blocking:                   true

  - rule_id:                    "ta_eval_003"
    rule_type:                  "max_length"
    parameters:
      max_tokens:               4096
    threshold:                  1.0
    blocking:                   false

  - rule_id:                    "ta_eval_004"
    rule_type:                  "script_validity"
    description:                "Output must contain valid Tamil Unicode characters (U+0B80–U+0BFF)"
    parameters:
      check_unicode_block:      "U+0B80-U+0BFF"
    threshold:                  1.0
    blocking:                   true

  - rule_id:                    "ta_eval_005"
    rule_type:                  "slot_coverage"
    description:                "All required slots must be filled"
    parameters:
      required_slots:           ["salutation", "thanks", "apology", "valediction"]
    threshold:                  1.0
    blocking:                   true

  - rule_id:                    "ta_eval_006"
    rule_type:                  "retroflex_preservation"
    description:                "Retroflex letters ட ண ள ழ ற must be correctly used and not confused with alveolar counterparts"
    parameters:
      check_retroflex_accuracy: true
    threshold:                  0.95
    blocking:                   false

  - rule_id:                    "ta_eval_007"
    rule_type:                  "diglossia_register_consistency"
    description:                "Classical (sentamil) and spoken (koduntamil) forms must not be mixed in a single utterance"
    parameters:
      check_register_mixing:    true
    threshold:                  0.90
    blocking:                   false

# =============================================================================
# 17. MEMORY POLICY
# =============================================================================

memory_policy:
  status: active

  working_memory:
    scope:                      "sentence_and_task"
    max_tokens:                 512
    inclusive_exclusive_tracking: "persists_within_conversation"
    register_tracking:          "diglossia_level_persists"

  episodic_memory:
    scope:                      "session"
    approved_events_only:       true

  semantic_memory:
    scope:                      "permanent"
    requires_approval:          true

  raw_dialogue_policy:
    storage:                    "NEVER"

